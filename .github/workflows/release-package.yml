name: Release package

on:
  workflow_dispatch:

# Unsigned release rehearsal only. Authenticode signing is a separate L05 gate;
# this workflow never creates tags, GitHub Releases, or Velopack artifacts.
permissions:
  contents: read

jobs:
  unsigned-release:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_MULTILEVEL_LOOKUP: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup for unsigned installer
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Non-signing release rehearsal
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .\scripts\rehearse-windows-release.ps1 -SkipTwoBuildCompare

      - name: Upload unsigned release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-release
          if-no-files-found: warn
          path: |
            artifacts/muesli-windows-*-win-x64.zip
            artifacts/MuesliSetup-*-win-x64.exe
            artifacts/test-results/*.trx
            artifacts/package-smoke-report.json
            artifacts/muesli-win32-manifest.xml
            artifacts/release-hashes.json
            artifacts/native-runtime-inventory.json
            artifacts/package-content-inventory.json
            artifacts/package-content-inventory-comparison.json
            artifacts/release-rehearsal-report.json
            artifacts/dirty-release-override.json
