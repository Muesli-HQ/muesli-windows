name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes its running CI; main always finishes.
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Unsigned public MSIX package path (L04 / PKG-01).
# Local and CI both run scripts/rehearse-windows-release.ps1 against the SDK
# pinned in global.json and the release identity in Directory.Build.props.
# Authenticode/MSIX signing is L05 / SIGN-01 / D5 and must not run here.
# Do not call scripts/sign-windows-release.ps1 from this workflow.
# The shipping artifact is the unsigned WinUI MSIX. A later signed-release
# workflow (L05) will timestamp and sign it; this job stays CPU-only and unsigned.
#
# Jobs: `tests` (unit tests) and `package` (unsigned MSIX rehearsal) run in parallel so a test
# failure is reported on its own. `ci-gate` is the single check required on main; it passes only
# when every job above it passed.

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_MULTILEVEL_LOOKUP: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-windows-build
        with:
          shared-repo-token: ${{ secrets.MUESLI_SHARED_REPO_TOKEN }}

      - name: Unit tests (Release)
        shell: pwsh
        run: ./scripts/run-windows-tests.ps1 -Configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          if-no-files-found: warn
          path: artifacts/test-results/*.trx

  package:
    name: unsigned package
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_MULTILEVEL_LOOKUP: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-windows-build
        with:
          shared-repo-token: ${{ secrets.MUESLI_SHARED_REPO_TOKEN }}

      # Unit tests run in the `tests` job; the rehearsal builds, packages and smoke-checks the MSIX.
      - name: Non-signing release rehearsal
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\rehearse-windows-release.ps1 -SkipTwoBuildCompare -SkipTests

      - name: Store packaging behavioral tests (no credentials)
        shell: pwsh
        run: ./scripts/tests/test-store-packaging.ps1

      - name: Upload unsigned release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-release
          if-no-files-found: warn
          path: |
            artifacts/msix/Muesli.Windows.WinUI_*.msix
            artifacts/test-results/*.trx
            artifacts/msix-smoke-report.json
            artifacts/muesli-win32-manifest.xml
            artifacts/release-hashes.json
            artifacts/native-runtime-inventory.json
            artifacts/package-content-inventory.json
            artifacts/package-content-inventory-comparison.json
            artifacts/release-rehearsal-report.json
            artifacts/dirty-release-override.json
            windows-native/Muesli.Windows.Tests/TestResults/*.trx

  ci-gate:
    name: ci-gate
    if: always()
    needs: [tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "tests: $TESTS, package: $PACKAGE"
          if [ "$TESTS" != "success" ] || [ "$PACKAGE" != "success" ]; then
            echo "::error::Windows CI failed (tests: $TESTS, package: $PACKAGE)."
            exit 1
          fi
